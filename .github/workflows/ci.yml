name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  shared:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: packages/shared/package-lock.json
      - run: npm ci --if-present || npm install
      - run: npx tsc --noEmit

  server:
    needs: shared
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run lint
      - name: Run Tests with Coverage Gate
        run: npm run test:cov -- --maxWorkers=2 --workerIdleMemoryLimit=512MB

  mobile:
    needs: shared
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - name: Run Tests with Coverage Gate
        run: npm run test:cov -- --maxWorkers=2 --coverageThreshold='{"global":{"lines":30,"branches":25,"statements":30}}'

  admin:
    needs: shared
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint --if-present
      - name: Build Admin Web App
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://bexiemart-production.up.railway.app/api/v1

