name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'apps/server/**'
              - 'packages/shared/**'
              - 'railway.json'
            docker:
              - 'apps/server/Dockerfile'
              - 'apps/admin/**'
              - 'packages/shared/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'

  shared:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: packages/shared/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Run Tests
        run: npm test

  server:
    needs: shared
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run lint
      - name: Run Tests with Coverage Gate
        run: npm run test:cov -- --maxWorkers=2 --workerIdleMemoryLimit=512MB

  mobile:
    needs: shared
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      # Coverage thresholds live in apps/mobile/jest.config.js (single source of truth).
      - name: Run Tests with Coverage Gate
        run: npm run test:cov -- --maxWorkers=2 --workerIdleMemoryLimit=512MB

  admin:
    needs: shared
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint --if-present
      - name: Run Tests
        run: npm test
      - name: Build Admin Web App
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://bexiemart-production.up.railway.app/api/v1

  docker-admin:
    # The admin image once shipped permanently broken (context/COPY drift) and
    # nothing ever caught it — building it here fails on the PR instead.
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build admin image
        run: docker build -t bexiemart-admin:ci apps/admin

  docker-server:
    # Same rationale for the API image Railway will build at deploy time.
    needs: changes
    if: needs.changes.outputs.docker == 'true' || needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build server image (root build context)
        run: docker build -f apps/server/Dockerfile -t bexiemart-server:ci .

  deploy-server:
    needs: [changes, shared, server, docker-server]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.server == 'true' &&
      needs.shared.result == 'success' &&
      needs.server.result == 'success' &&
      (needs.docker-server.result == 'success' || needs.docker-server.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-server
      cancel-in-progress: false
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: curl -fsSL https://railway.app/install.sh | sh
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: bexiemart-api
          RAILWAY_ENVIRONMENT: production
        run: railway up --ci --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT"
      - name: Verify health endpoint
        run: curl -fsS --retry 6 --retry-delay 15 --retry-all-errors https://bexiemart-production.up.railway.app/api/v1/health

