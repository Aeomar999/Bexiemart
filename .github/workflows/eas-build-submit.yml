name: EAS Build & Submit (Production)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        type: choice
        options: [android, ios, all]
        default: all
      channel:
        description: "EAS release channel"
        type: string
        default: production
  release:
    types: [created]

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    outputs:
      artifacts: ${{ steps.set-artifacts.outputs.artifacts }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci

      - name: Build Android production bundle
        if: ${{ inputs.platform != 'ios' }}
        env:
          EAS_NO_VCS_URL: 1
        run: npx eas build --profile production --platform android --non-interactive --wait

      - name: Build iOS production bundle
        if: ${{ inputs.platform != 'android' }}
        env:
          EAS_NO_VCS_URL: 1
        run: npx eas build --profile production --platform ios --non-interactive --wait

      - name: Record build artifacts
        id: set-artifacts
        run: |
          echo "artifacts=$(date +%s)" >> $GITHUB_OUTPUT

  submit-android:
    needs: build
    if: ${{ inputs.platform != 'ios' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Submit Android to Play Store
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          # Write the service account JSON to a temp file for EAS submit
          echo "$GOOGLE_SERVICE_ACCOUNT_KEY" > ./google-api-key.json
          npx eas submit --profile production --platform android --non-interactive --latest

  submit-ios:
    needs: build
    if: ${{ inputs.platform != 'android' }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Submit iOS to App Store Connect
        run: npx eas submit --profile production --platform ios --non-interactive --latest
